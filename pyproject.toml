[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safeci"
version = "0.1.0"
description = "Adaptive, trace-first safety evaluation for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
safeci = "safeci.cli:main"

[tool.setuptools.packages.find]
include = ["safeci*"]
